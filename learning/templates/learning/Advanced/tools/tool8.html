<body>
<div class="lesson-container">
    <!-- Header -->
    <div class="tool-header">
        <div class="hero-content">
            <div class="tool-badge"> TOOL 8 — REGISTER MASTERY</div>
            <h1> REGISTER REMIX</h1>
            <div class="subtitle">Rewrite the same message in different registers — Academic, Professional, and Verbal. The ultimate fluency exercise.</div>
        </div>
    </div>

    <div id="app"></div>
</div>

<script>
    // CSRF Token for Django
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');

    // Game State (No localStorage - fresh start every time)
    let currentScenario = 1;
    let currentStep = 0;
    let answers = { s1: {}, s2: {} };
    let validations = { s1: {}, s2: {} };
    let scenario1Completed = false;
    let scenario2Completed = false;

    const scenario1 = {
        title: "  Workshop Electrical Wiring Fault",
        baseMessage: "There is a wiring fault. It is dangerous. Fix it.",
        registers: [
            { id: "academic", name: "Academic / Technical Report", badge: "academic", 
              instruction: "Formal, objective, use technical terminology, passive voice preferred.",
              sample: "A critical wiring fault has been identified in the workshop installation. This poses an immediate safety hazard and requires urgent remedial action." },
            { id: "email", name: "Professional Email to Management", badge: "email",
              instruction: "Courteous, diplomatic, action-oriented. Include risk awareness.",
              sample: "Dear Management, a wiring fault has been detected in the workshop. This presents a safety concern. I recommend scheduling an urgent repair." },
            { id: "verbal", name: "Verbal Explanation to Technician", badge: "verbal",
              instruction: "Clear, direct, respectful, actionable. Focus on immediate safety.",
              sample: "There's a wiring fault that's unsafe. Please fix it immediately and secure the area before starting work." }
        ]
    };

    const scenario2 = {
        title: " Final Year Project Delayed",
        baseMessage: "We could not get the parts. The project got delayed.",
        registers: [
            { id: "guide", name: "Formal Written to Project Guide", badge: "guide",
              instruction: "Respectful, explanatory. Include reason, impact, and revised timeline.",
              sample: "Due to unavailability of critical components, the project timeline has been delayed by two weeks. I apologize and have revised the schedule accordingly." },
            { id: "team", name: "Verbal Update to Project Team", badge: "team",
              instruction: "Clear, transparent, collaborative, solution-oriented. Use 'we'.",
              sample: "Team, we couldn't get the parts on time, so the project is delayed by two weeks. Let's adjust our plan and meet tomorrow." },
            { id: "linkedin", name: "LinkedIn Post (Professional)", badge: "linkedin",
              instruction: "Reflective, growth-oriented, authentic. Share what you learned.",
              sample: "Delays are part of engineering. Our project faced a 2-week setback due to component unavailability, but it taught me the value of contingency planning." }
        ]
    };

    let currentScenarioData = scenario1;
    let currentRegisterIndex = 0;
    let isAnswerValidated = false;  // Track if current answer has been validated

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function updateProgress() {
        let totalSteps = 8;
        let completedSteps = 0;
        
        if (scenario2Completed) completedSteps = 8;
        else if (scenario1Completed) {
            let regCount = 0;
            for (let reg of scenario2.registers) {
                if (validations.s2[reg.id]?.valid === true) regCount++;
            }
            if (currentStep === 3 && regCount === 3) completedSteps = 8;
            else if (currentStep === 3) completedSteps = 7;
            else completedSteps = 4 + currentStep;
        } else {
            let regCount = 0;
            for (let reg of scenario1.registers) {
                if (validations.s1[reg.id]?.valid === true) regCount++;
            }
            if (currentStep === 3 && regCount === 3) completedSteps = 4;
            else if (currentStep === 3) completedSteps = 3;
            else completedSteps = currentStep;
        }
        
        const percent = (completedSteps / totalSteps) * 100;
        const progressFill = document.getElementById('progressFill');
        const stepCount = document.getElementById('stepCount');
        if (progressFill) progressFill.style.width = `${percent}%`;
        if (stepCount) stepCount.innerText = `Step ${Math.min(completedSteps, totalSteps)} of ${totalSteps}`;
    }

    // Check if answer is exactly the example from hint
    function isCopyingExample(answer, sampleText) {
        if (!answer || !sampleText) return false;
        // Remove extra spaces and compare normalized strings
        const normalizedAnswer = answer.trim().toLowerCase().replace(/\s+/g, ' ');
        const normalizedSample = sampleText.trim().toLowerCase().replace(/\s+/g, ' ');
        // Check if answer is substantially similar to the example (>80% match)
        if (normalizedAnswer === normalizedSample) return true;
        // Check if answer contains the entire example as a substring
        if (normalizedSample.length > 30 && normalizedAnswer.includes(normalizedSample)) return true;
        return false;
    }

    async function checkCurrentAnswer() {
        const textarea = document.getElementById('registerAnswer');
        const answer = textarea.value.trim();
        const register = currentScenarioData.registers[currentRegisterIndex];
        
        if (!answer) {
            showFeedback('❌ Please write your response.', 'error');
            return false;
        }
        
        // Check if user is copying the example hint
        if (isCopyingExample(answer, register.sample)) {
            showFeedback('⚠️ Please write your own answer, not the example hint! Use the hint as inspiration only.', 'warning');
            textarea.classList.add('incorrect');
            return false;
        }
        
        const checkBtn = document.getElementById('actionBtn');
if (!checkBtn) {
    console.error('Button not found');
    return false;
}
checkBtn.disabled = true;
checkBtn.innerHTML = '⏳ Validating...';
        
        const result = await validateWithAI(register, answer, currentScenario, currentScenarioData);
        
        if (result.valid) {
            textarea.classList.add('correct');
            textarea.classList.remove('incorrect');
            showFeedback(result.feedback || '✅ Correct! Great register use!', 'success');
            textarea.classList.add('pulse');
            setTimeout(() => textarea.classList.remove('pulse'), 300);
            
            if (currentScenario === 1) {
                validations.s1[register.id] = { valid: true, feedback: result.feedback };
                answers.s1[register.id] = answer;
            } else {
                validations.s2[register.id] = { valid: true, feedback: result.feedback };
                answers.s2[register.id] = answer;
            }
            
            isAnswerValidated = true;
            
            // Change button from "Check Answer" to "Next"
            checkBtn.innerHTML = 'Next →';
checkBtn.classList.remove('btn-primary');
checkBtn.classList.add('btn-success');
checkBtn.disabled = false;  // ← ADD THIS LINE
checkBtn.onclick = goToNext;
            
        } else {
            textarea.classList.add('incorrect');
            textarea.classList.remove('correct');
            showFeedback(result.feedback || '❌ Not quite right. Check the instruction and try again.', 'error');
            if (currentScenario === 1) {
                validations.s1[register.id] = { valid: false, feedback: result.feedback };
                answers.s1[register.id] = answer;
            } else {
                validations.s2[register.id] = { valid: false, feedback: result.feedback };
                answers.s2[register.id] = answer;
            }
            isAnswerValidated = false;
            checkBtn.disabled = false;
            checkBtn.innerHTML = '✓ Check Answer';
            checkBtn.classList.add('btn-primary');
            checkBtn.classList.remove('btn-success');
            checkBtn.onclick = () => checkCurrentAnswer();
        }
        
        return result.valid;
    }
    
    async function goToNext() {
        if (currentStep === 3) {
            if (currentScenario === 1) {
                scenario1Completed = true;
                currentScenario = 2;
                currentScenarioData = scenario2;
                currentStep = 0;
                currentRegisterIndex = 0;
                isAnswerValidated = false;
                renderRegisterScreen();
                updateProgress();
               
                showFeedback('🎉 Scenario 1 Complete! Now tackle Scenario 2!', 'success');
            } else {
                scenario2Completed = true;
                renderCompletionScreen();
               
            }
            return;
        }
        
        if (currentRegisterIndex < 2) {
            currentRegisterIndex++;
            isAnswerValidated = false;
            renderRegisterScreen();
        } else {
            currentStep = 3;
            renderResultScreen();
        }
        updateProgress();
    }

    async function validateWithAI(register, answer, scenarioNum, scenarioData) {
        const prompt = `You are evaluating a REGISTER REMIX exercise.

BASE MESSAGE: "${scenarioData.baseMessage}"
TARGET REGISTER: ${register.name}
REQUIREMENT: ${register.instruction}
STUDENT'S ANSWER: "${answer}"

Evaluate STRICTLY:
1. Is the tone appropriate for the register?
2. Does it use professional vocabulary?
3. Is it grammatically correct?
4. Does the student write in their own words (not copying the example)?

Return JSON: {"correct": true/false, "feedback": "short specific feedback (max 30 words)"}`;

        try {
            const response = await fetch('/learning/ai/evaluate/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
                body: JSON.stringify({
                    text: answer,
                    task_type: 'register_remix',
                    day_number: 8,
                    level: 'advanced',
                    system_prompt: prompt
                })
            });
            const data = await response.json();
            return { valid: data.correct === true, feedback: data.feedback || (data.correct ? '✅ Perfect register!' : '❌ Needs adjustment.') };
        } catch (error) {
            console.error('AI Error:', error);
            if (!answer || answer.length < 20) return { valid: false, feedback: '❌ Please write a complete sentence (min 20 characters).' };
            if (answer.length > 30) return { valid: true, feedback: '✅ Acceptable transformation!' };
            return { valid: false, feedback: '❌ Please elaborate more.' };
        }
    }

    }

        if (currentStep === 3) {

            currentRegisterIndex = 2;

                    <div class="action-buttons">

        `;
        
        document.getElementById('app').innerHTML = html;
        
       const actionBtn = document.getElementById('actionBtn');
if (actionBtn) {
    actionBtn.disabled = false;  // ← ensure it's clickable

}

    function launchConfetti() {
        const canvas = document.createElement('canvas');
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.pointerEvents = 'none';
        canvas.style.zIndex = '10000';
        document.body.appendChild(canvas);
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const particles = [];
        for (let i = 0; i < 200; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: canvas.height,
                w: Math.random() * 12 + 5,
                h: Math.random() * 12 + 5,
                color: `hsl(${Math.random() * 360}, 75%, 55%)`,
                vx: (Math.random() - 0.5) * 5,
                vy: Math.random() * -15 - 8,
                gravity: 0.22,
                rot: Math.random() * Math.PI * 2
            });
        }
        let animId;
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            for (let p of particles) {
                if (p.y < canvas.height + 200) {
                    active = true;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.rot += 0.05;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
                    ctx.restore();
                }
            }
            if (active) animId = requestAnimationFrame(animate);
            else canvas.remove();
        }
        animate();
        setTimeout(() => { if(canvas.parentNode) canvas.remove(); }, 2500);
    }
